name: Feature request
description: Suggest an improvement to EmberCast
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like EmberCast to do?
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Relevant devices and versions
      description: Include the Fire TV and sender models if known.
    validations:
      required: false
